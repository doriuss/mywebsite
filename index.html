
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>דומיין למכירה</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 55px 35px;
      border-radius: 20px;
      text-align: center;
      max-width: 550px;
      width: 100%;
      box-shadow: 0 10px 35px #00000012;
    }

    h1 { color: #172b4d; }
    p { color: #64748b; line-height: 1.8; }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 32px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌐 הדומיין הזה יכול להיות שלך!</h1>
    <p>הדומיין זמין לרכישה.</p>
    <p>לפרטים נוספים ולהצעות מחיר,
       ניתן ליצור קשר.</p>

    <a href="mailto:your@email.com">
      ✉️ יצירת קשר
    </a>
  </div>
</body>
</html>
