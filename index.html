<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>דומיין למכירה</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .wrapper {
      max-width: 550px;
      width: 100%;
    }

    /* אזור השמיים מעל הכרטיס */
    .sky {
      position: relative;
      height: 90px;
      overflow: hidden;
    }

    .plane {
      position: absolute;
      top: 20px;
      direction: ltr;
      display: flex;
      align-items: center;
      animation: fly 9s linear infinite;
    }

    .plane-inner {
      display: flex;
      align-items: center;
      animation: bob 1.6s ease-in-out infinite alternate;
    }

    .banner {
      background: #fbbf24;
      color: #172b4d;
      font-weight: bold;
      font-size: 15px;
      padding: 8px 14px;
      border-radius: 4px;
      white-space: nowrap;
      box-shadow: 0 4px 10px #00000015;
    }

    .rope {
      width: 30px;
      height: 2px;
      background: #94a3b8;
    }

    @keyframes fly {
      from { left: -280px; }
      to   { left: 100%; }
    }

    @keyframes bob {
      from { transform: translateY(-5px); }
      to   { transform: translateY(5px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .plane { animation: none; left: 50%; transform: translateX(-50%); }
      .plane-inner { animation: none; }
    }

    .card {
      background: white;
      padding: 55px 35px;
      border-radius: 20px;
      text-align: center;
      width: 100%;
      box-shadow: 0 10px 35px #00000012;
    }

    h1 { color: #172b4d; }
    p { color: #64748b; line-height: 1.8; }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 32px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }

    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="wrapper">

    <!-- המטוס -->
    <div class="sky" aria-hidden="true">
      <div class="plane">
        <div class="plane-inner">
          <div class="banner">✨ למכירה! ✨</div>
          <div class="rope"></div>
          <svg width="70" height="44" viewBox="0 0 70 44">
            <!-- כנף רחוקה (מאחורי הגוף) -->
            <path d="M30 15 L42 15 L37 2 L31 2Z" fill="#93c5fd"/>
            <!-- זנב אנכי -->
            <path d="M8 14 L4 3 H13 L20 14Z" fill="#1d4ed8"/>
            <!-- גוף המטוס -->
            <path d="M5 20 Q5 14 14 14 H52 Q66 14 68 20 Q66 26 52 26 H14 Q5 26 5 20Z" fill="#2563eb"/>
            <!-- תא טייס -->
            <path d="M56 15 Q63 15 65 19 H56Z" fill="#bfdbfe"/>
            <!-- חלונות -->
            <circle cx="36" cy="19" r="2" fill="white"/>
            <circle cx="43" cy="19" r="2" fill="white"/>
            <circle cx="50" cy="19" r="2" fill="white"/>
            <!-- כנף זנב אופקית -->
            <path d="M6 21 L16 21 L12 28 L5 28Z" fill="#1d4ed8"/>
            <!-- כנף קרובה -->
            <path d="M28 21 L42 21 L35 38 L27 38Z" fill="#1d4ed8"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="card">
      <h1>🌐 הדומיין הזה יכול להיות שלך!</h1>
      <p>הדומיין זמין לרכישה.</p>
      <p>לפרטים נוספים ולהצעות מחיר,
         ניתן ליצור קשר.</p>

      <a href="mailto:your@email.com">
        ✉️ יצירת קשר
      </a>
    </div>

  </div>
</body>
</html>
