area.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.altKey&&!e.metaKey&&!e.isComposing){e.preventDefault();if(!e.repeat)enterSpeech()}});
// Editing the text discards the paused recording so Continue never reads stale text.
area.addEventListener('input',()=>{if(area.value.length>100)area.value=area.value.slice(0,100);if(activeUtterance||cloudActive)stopSpeech(false)});
document.querySelectorAll('[data-voice]').forEach(b=>b.addEventListener('click',()=>{stopSpeech(false);voiceGender=b.dataset.voice;speechUI();renderQuickPhrases()}));
if(synth){synth.getVoices();synth.addEventListener('voiceschanged',()=>{synth.getVoices();if(speechState==='missing'||speechState==='missingGender'){speechState='';speechUI()}})}
window.addEventListener('pagehide',()=>{clearCloud();if(synth)synth.cancel()});
speechUI();

let languageShortcutHeld=false;
mode.addEventListener('change',()=>{if(mode.value!=='auto')language=mode.value;render();area.focus()});window.addEventListener('keydown',e=>{
const languageShortcut=(e.key==='Shift'&&e.altKey)||(e.key==='Alt'&&e.shiftKey);
if(languageShortcut&&!e.ctrlKey&&!e.metaKey&&!e.getModifierState?.('AltGraph')&&!languageShortcutHeld&&!e.repeat){
languageShortcutHeld=true;
mode.value='auto';const order=['he','en','ru'];language=order[(order.indexOf(language)+1)%order.length];render()
}
if(mode.value==='auto'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){let next=/^[א-ת]$/.test(e.key)?'he':/^[a-zA-Z]$/.test(e.key)?'en':/^[а-яё]$/i.test(e.key)?'ru':language;if(next!==language){language=next;render()}}buttons.get(e.code)?.classList.add('active');document.querySelector('#last').textContent=translations[language].keys[e.code]||e.key;
});window.addEventListener('keyup',e=>{buttons.get(e.code)?.classList.remove('active');if(e.key==='Alt'||e.key==='Shift')languageShortcutHeld=false});window.addEventListener('blur',()=>{languageShortcutHeld=false;buttons.forEach(b=>b.classList.remove('active'))});render();
</script></html>
